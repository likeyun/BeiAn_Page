<style>

13px;color:#9ca3af;margin-bottom:24px}.article p{color:#4b5563;margin-bottom:18px}.article img{border:1px solid #e5e7eb;border-radius:12px;margin-top:18px}footer{border-top:1px solid #e5e7eb;background:#fff}.footer{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:#8b93a1;font-size:13px}.footer a:hover{color:#2563eb}@media(max-width:720px){.hero{padding:44px 0 30px}.posts{grid-template-columns:1fr}.post{padding:18px}.article{padding:20px}.article h2{font-size:24px}.footer{flex-direction:column;align-items:flex-start;justify-content:center;padding:20px 0}.nav-right{display:none}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="./">TANKING <span>Blog</span></a><div class="nav-right">记录开发 · 分享技术 · 持续学习</div></div></header>
<main class="wrap">
<section class="hero"><h1>你好，我是 <span>TANKING</span></h1><p>这里是我的个人技术博客，主要记录 Web 开发、PHP、JavaScript、Python、Go 以及日常开发过程中遇到的问题与解决方案。</p></section>
<section id="list"><div class="section-title"><h2>博客文章</h2><span>共 13 篇</span></div><div class="posts" id="posts"></div></section>
<section class="article" id="article"><button class="back" onclick="closeArticle()">← 返回文章列表</button><h2 id="articleTitle"></h2><div class="meta">TANKING · 技术笔记</div><div id="articleContent"></div></section>
</main>
<footer><div class="wrap footer"><div>© <span id="year"></span> TANKING · 个人技术博客</div><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备16088839号</a></div></footer>
<script>
const articles=[
{title:'JavaScript一键复制内容（document.execCommand原生JS设置剪贴板）',desc:'有时候为了方便用户快速复制页面内容，可以使用 JavaScript 原生方法实现一键复制。',img:'ba_img/20220728143609.png'},
{title:'golang实现一个简单的HTTP服务（go语言实现http get传参）',desc:'如何使用 Golang 实现 HTTP 服务并在浏览器中完成 GET 参数传递。',img:'ba_img/20220728144415.png'},
{title:'html2canvas将指定区域导出为图片（js将div导出为图片）',desc:'html2canvas 可以将页面指定区域渲染成 Canvas，并在客户端直接生成图片。',img:'ba_img/20220728144616.png'},
{title:'原生Js调用Fetch Api请求接口（新的Ajax解决方案）',desc:'Fetch API 是现代浏览器提供的原生网络请求方案，基于 Promise，不依赖 XMLHttpRequest。',img:'ba_img/20220728144750.png'},
{title:'HTML DOM querySelectorAll() 代替 jQuery CSS选择器',desc:'querySelectorAll() 可以使用 CSS 选择器获取页面元素，无需额外引入 jQuery。',img:'ba_img/20220728144849.png'},
{title:'php图片上传函数（Curl上传图片）',desc:'使用 PHP Curl 实现图片上传请求的基础示例。',img:'ba_img/20220728145009.png'},
{title:'万能PHP Curl封装类，适合多个场景，调用方便！',desc:'对常用 PHP Curl 请求进行统一封装，方便在不同接口场景中快速调用。',img:'ba_img/20220728145758.png'},
{title:'一个非常实用的php数据库pdo操作类（CURD操作类）',desc:'基于 PDO 封装常用数据库操作，提升开发效率并增强数据库访问安全性。',img:'ba_img/20220728145827.png'},
{title:'Python获取access_token（获取小程序的access_token）',desc:'使用 Python 调用微信小程序接口获取 access_token，并结合 Tkinter 做简单界面。',img:'ba_img/20220728145918.png'},
{title:'php生成配置文件config.php 生成数组配置文件',desc:'在 PHP 项目中自动生成数组配置文件，可用于保存数据库和公共参数配置。',img:'ba_img/20220728145955.png'},
{title:'iframe无刷新提交表单，iframe仿ajax提交表单',desc:'通过 iframe 实现传统页面中的无刷新表单提交，适合部分兼容性场景。',img:'ba_img/20220728152035.png'},
{title:'原生Js表单验证，Js验证表单是否为空',desc:'使用原生 JavaScript 在前端进行基础表单校验，减少无效请求并改善交互体验。',img:'ba_img/20220728152125.png'},
{title:'Ajax+History实现无刷新浏览器改变页面内容',desc:'结合 Ajax 和 History API，在不刷新页面的情况下更新内容并同步浏览器地址。',img:'ba_img/20220728152205.png'}
];
const posts=document.getElementById('posts');
posts.innerHTML=articles.map((a,i)=>`<article class="post" onclick="openArticle(${i})"><div class="meta">技术笔记 · Web开发</div><h3>${a.title}</h3><p>${a.desc}</p><span class="more">阅读全文 →</span></article>`).join('');
function openArticle(i){const a=articles[i];document.getElementById('articleTitle').textContent=a.title;document.getElementById('articleContent').innerHTML=`<p>${a.desc}</p><img src="${a.img}" alt="${a.title}">`;document.getElementById('list').style.display='none';document.getElementById('article').classList.add('active');window.scrollTo({top:0,behavior:'smooth'});history.replaceState(null,'','#article-'+(i+1))}
function closeArticle(){document.getElementById('article').classList.remove('active');document.getElementById('list').style.display='block';history.replaceState(null,'','./');window.scrollTo({top:0,behavior:'smooth'})}
const m=location.hash.match(/^#article-(\d+)$/);if(m&&articles[m[1]-1])openArticle(m[1]-1);document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body>
