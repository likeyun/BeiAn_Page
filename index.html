<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="中国个人网站备案展示页面">
<meta name="robots" content="index,follow">
<title>TANKING - 个人网站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f7fb;--card:rgba(255,255,255,.86);--text:#172033;--muted:#6b7280;--line:#e6eaf0;--primary:#2563eb;--primary-soft:#eef4ff;--shadow:0 20px 60px rgba(31,41,55,.08)}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at top left,#eaf2ff 0,transparent 36%),radial-gradient(circle at bottom right,#eef8ff 0,transparent 30%),var(--bg);color:var(--text);line-height:1.7}
a{color:inherit;text-decoration:none}
.page{min-height:100vh;display:flex;flex-direction:column}
header{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:28px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 8px 24px rgba(37,99,235,.25)}
.status{display:flex;align-items:center;gap:8px;color:#4b5563;font-size:14px}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.12)}
main{flex:1;width:min(1120px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center;padding:40px 0 72px}
.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.1;letter-spacing:-2px;margin-bottom:22px}.hero h1 span{display:block;color:var(--primary)}
.hero p{max-width:680px;color:var(--muted);font-size:17px;margin-bottom:32px}
.tags{display:flex;flex-wrap:wrap;gap:10px}.tag{padding:9px 14px;border:1px solid #dfe7f3;background:rgba(255,255,255,.72);border-radius:999px;color:#4b5563;font-size:14px;backdrop-filter:blur(10px)}
.card{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}
.card-head{padding:24px 24px 18px;border-bottom:1px solid var(--line)}.card-head strong{font-size:18px}.card-head p{font-size:13px;color:var(--muted);margin-top:4px}
.info{padding:6px 24px 18px}.row{display:flex;justify-content:space-between;gap:20px;padding:17px 0;border-bottom:1px dashed var(--line);font-size:14px}.row:last-child{border-bottom:0}.label{color:var(--muted)}.value{text-align:right;font-weight:600;word-break:break-all}
.notice{margin:0 24px 24px;padding:14px 16px;border-radius:14px;background:var(--primary-soft);color:#31558b;font-size:13px}
footer{width:min(1120px,calc(100% - 40px));margin:0 auto;border-top:1px solid var(--line);padding:24px 0 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;color:#7b8494;font-size:13px}
.beian{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.beian a:hover{color:var(--primary)}
.copyright{white-space:nowrap}
@media(max-width:820px){header{padding:20px 0}.status{display:none}main{grid-template-columns:1fr;padding:28px 0 48px;gap:30px}.hero h1{letter-spacing:-1px}.hero p{font-size:15px}.card{border-radius:20px}footer{flex-direction:column;align-items:flex-start}.copyright{white-space:normal}}
@media(max-width:480px){header,main,footer{width:min(100% - 28px,1120px)}.brand{font-size:16px}.logo{width:34px;height:34px}.hero h1{font-size:42px}.row{flex-direction:column;gap:4px}.value{text-align:left}.beian{gap:10px;flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="page">
<header>
<a class="brand" href="./"><span class="logo">T</span><span>TANKING</span></a>
<div class="status"><span class="dot"></span>网站正常运行</div>
</header>
<main>
<section class="hero">
<h1>个人网站<span>备案展示页</span></h1>
<p>这里是一个用于中国大陆个人网站备案展示的简洁主页。页面仅展示网站基本信息、备案信息与站点用途，不提供用户注册、评论、交易等交互服务。</p>
<div class="tags"><span class="tag">个人网站</span><span class="tag">技术分享</span><span class="tag">学习记录</span><span class="tag">非经营性网站</span></div>
</section>
<aside class="card">
<div class="card-head"><strong>网站信息</strong><p>Website Information</p></div>
<div class="info">
<div class="row"><span class="label">网站名称</span><span class="value">TANKING 的个人网站</span></div>
<div class="row"><span class="label">网站类型</span><span class="value">个人 / 非经营性</span></div>
<div class="row"><span class="label">网站用途</span><span class="value">技术学习与内容记录</span></div>
<div class="row"><span class="label">内容方向</span><span class="value">Web 开发 / 编程笔记</span></div>
<div class="row"><span class="label">联系方式</span><span class="value">站长个人维护</span></div>
</div>
<div class="notice">本站内容由站长个人整理维护，不涉及经营性互联网信息服务。</div>
</aside>
</main>
<footer>
<div class="beian">
<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">粤ICP备16088839号</a>
<a href="https://www.beian.gov.cn/" target="_blank" rel="noopener noreferrer">公安备案信息（按实际备案后填写）</a>
</div>
<div class="copyright">© <span id="year"></span> TANKING</div>
</footer>
</div>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
